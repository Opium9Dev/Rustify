[package]
name = "rustify"
version = "0.1.0"
edition = "2021"
description = "Desktop music player built with Rust and egui"
readme = "README.md"
publish = false

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25.10", features = ["ico", "jpeg", "png", "webp"] }
rodio = { version = "0.20", default-features = false, features = ["vorbis", "symphonia-aac", "symphonia-isomp4"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3